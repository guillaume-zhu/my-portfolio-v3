<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-------- LINKS --------->
    <!-- CSS -->
    <link rel="stylesheet" href="./src/assets/css/reset.css" />
    <link rel="stylesheet" href="./src/assets/css/style.css" />

    <!-- JS -->
    <script type="module" src="/src/assets/js/main.js"></script>
    <script type="module" src="/src/assets/js//animation.js"></script>

    <!-- FAV -->
    <link rel="icon" type="image/svg+xml" href="/logo-guillaume-zhu-32px.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>portfolio-v3</title>
  </head>
  <body>
    <main>
      <!-------- HERO SECTION -------->
      <section class="hero-three">
        <div class="hero-three__frame">
          <canvas class="webgl"></canvas>
        </div>

        <div class="hero-content">
          <!-- <h1 class="hero-title">Guillaume Zhu</h1>
          <p class="hero-title">Creative Developer - Directeur Artistique</p> -->
        </div>
      </section>

      <!-------- MANIFESTO SECTION -------->
      <section class="manifesto">
        <div class="container">
          <p class="text">Je crée des expériences à la croisée du design et du code.</p>
        </div>
      </section>

      <!-------- TRAJECTOIRY SECTION -------->
      <section class="trajectory">
        <section class="entry">
          <div class="container">
            <h2 class="title">Trajectoire</h2>
          </div>
        </section>

        <section class="trajectory-sentences">
          <div class="trajectory-sentences__pin-height">
            <div class="trajectory-sentences__container">
              <div class="trajectory-sentences__visuals" aria-hidden="true">
                <div class="trajectory-sentences__visual trajectory-sentences__visual--left"></div>
                <div class="trajectory-sentences__visual trajectory-sentences__visual--right"></div>
              </div>

              <div class="trajectory-sentences__center">
                <div class="trajectory-sentences__sentence">D'abord</div>

                <div class="trajectory-sentences__sentence is-two-lines">
                  direction <br />
                  artistique.
                </div>

                <div class="trajectory-sentences__sentence">Puis</div>

                <div class="trajectory-sentences__sentence is-two-lines">
                  développement <br />front.
                </div>

                <div class="trajectory-sentences__sentence is-today">Aujourd'hui</div>

                <div class="trajectory-sentences__sentence is-dialogue">je fais dialoguer</div>

                <div class="trajectory-sentences__sentence is-both">les deux.</div>
              </div>
            </div>
          </div>
        </section>
      </section>

      <!-------- TOOLKIT SECTION -------->
      <section class="toolkit"></section>
    </main>
  </body>
</html>
