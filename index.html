<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-------- LINKS --------->
    <!-- CSS -->
    <link rel="stylesheet" href="./src/assets/css/reset.css" />
    <link rel="stylesheet" href="./src/assets/css/style.css" />

    <!-- JS -->
    <script type="module" src="/src/assets/js/main.js"></script>
    <script type="module" src="/src/assets/js//animation.js"></script>

    <!-- FAV -->
    <link rel="icon" type="image/svg+xml" href="/logo-guillaume-zhu-32px.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>portfolio-v3</title>
  </head>
  <body>
    <main>
      <!-------- HERO SECTION -------->
      <section class="hero-three">
        <div class="hero-three__frame">
          <canvas class="webgl"></canvas>
        </div>

        <div class="hero-content">
          <!-- <h1 class="hero-title">Guillaume Zhu</h1>
          <p class="hero-title">Creative Developer - Directeur Artistique</p> -->
        </div>
      </section>

      <!-------- MANIFESTO SECTION -------->
      <section class="manifesto">
        <div class="container">
          <p class="text">Je crée des expériences à la croisée du design et du code.</p>
        </div>
      </section>

      <!-------- TRAJECTOIRY SECTION -------->
      <section class="trajectory">
        <section class="entry">
          <div class="container">
            <h2 class="title">Trajectoire</h2>
          </div>
        </section>

        <section class="trajectory-sentences">
          <div class="trajectory-sentences__pin-height">
            <div class="trajectory-sentences__container">
              <div class="trajectory-sentences__visuals" aria-hidden="true">
                <div class="trajectory-sentences__visual trajectory-sentences__visual--left"></div>
                <div class="trajectory-sentences__visual trajectory-sentences__visual--right"></div>
              </div>

              <div class="trajectory-sentences__center">
                <div class="trajectory-sentences__sentence">D'abord</div>

                <div class="trajectory-sentences__sentence is-two-lines">
                  direction <br />
                  artistique.
                </div>

                <div class="trajectory-sentences__sentence">Puis</div>

                <div class="trajectory-sentences__sentence is-two-lines">
                  développement <br />front.
                </div>

                <div class="trajectory-sentences__sentence is-today">Aujourd'hui</div>

                <div class="trajectory-sentences__sentence is-dialogue">je fais dialoguer</div>

                <div class="trajectory-sentences__sentence is-both">les deux.</div>
              </div>
            </div>
          </div>
        </section>
      </section>

      <!-------- TOOLKIT SECTION -------->
      <section class="toolkit">
        <div class="toolkit__pin-height">
          <div class="toolkit__container">
            <div class="toolkit__header">
              <h2 class="toolkit__title">Toolkit</h2>

              <div class="toolkit__subtitle-wrap">
                <h3 class="toolkit__subtitle toolkit__subtitle--front">Creative Front-end</h3>
                <h3 class="toolkit__subtitle toolkit__subtitle--art">Art Direction</h3>
              </div>
            </div>

            <!-- Frontend Deck -->
            <div class="toolkit__wheel toolkit__wheel--frontend">
              <div class="toolkit__slot">
                <div class="toolkit-card toolkit-card--javascript">
                  <img src="/images/toolkit/frontend/javascript.svg" alt="JavaScript" />
                </div>
              </div>

              <div class="toolkit__slot">
                <div class="toolkit-card toolkit-card--threejs">
                  <img src="/images/toolkit/frontend/threejs.svg" alt="Three.js" />
                </div>
              </div>

              <div class="toolkit__slot">
                <div class="toolkit-card toolkit-card--glsl">
                  <img src="/images/toolkit/frontend/glsl.svg" alt="GLSL" />
                </div>
              </div>

              <div class="toolkit__slot">
                <div class="toolkit-card toolkit-card--gsap">
                  <img src="/images/toolkit/frontend/gsap.svg" alt="GSAP" />
                </div>
              </div>

              <div class="toolkit__slot">
                <div class="toolkit-card toolkit-card--vuejs">
                  <img src="/images/toolkit/frontend/vuejs.svg" alt="Vue.js" />
                </div>
              </div>

              <div class="toolkit__slot">
                <div class="toolkit-card toolkit-card--react">
                  <img src="/images/toolkit/frontend/react.svg" alt="React" />
                </div>
              </div>

              <div class="toolkit__slot">
                <div class="toolkit-card toolkit-card--webflow">
                  <img src="/images/toolkit/frontend/webflow.svg" alt="Webflow" />
                </div>
              </div>

              <div class="toolkit__slot toolkit__slot--transition">
                <div class="toolkit-card toolkit-card--flip toolkit-card--shopify">
                  <div class="toolkit-card__flipper">
                    <div class="toolkit-card__face toolkit-card--front">
                      <img src="/images/toolkit/frontend/shopify.svg" alt="Shopify" />
                    </div>

                    <div class="toolkit-card__face toolkit-card__face--back">
                      <img src="/images/toolkit/art-direction/figma.svg" alt="Figma" />
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Art direction deck -->
            <div class="toolkit__wheel toolkit__wheel--art-direction">
              <div class="toolkit__slot">
                <div class="toolkit-card toolkit-card--figma">
                  <img src="/images/toolkit/art-direction/figma.svg" alt="Figma" />
                </div>
              </div>

              <div class="toolkit__slot">
                <div class="toolkit-card toolkit-card--photoshop">
                  <img src="/images/toolkit/art-direction/photoshop.svg" alt="Photoshop" />
                </div>
              </div>

              <div class="toolkit__slot">
                <div class="toolkit-card toolkit-card--illustrator">
                  <img src="/images/toolkit/art-direction/illustrator.svg" alt="Illustrator" />
                </div>
              </div>

              <div class="toolkit__slot">
                <div class="toolkit-card toolkit-card--indesign">
                  <img src="/images/toolkit/art-direction/indesign.svg" alt="InDesign" />
                </div>
              </div>

              <div class="toolkit__slot">
                <div class="toolkit-card toolkit-card--after-effects">
                  <img src="/images/toolkit/art-direction/aftereffects.svg" alt="After Effects" />
                </div>
              </div>

              <div class="toolkit__slot">
                <div class="toolkit-card toolkit-card--capcut">
                  <img src="/images/toolkit/art-direction/capcut.svg" alt="CapCut" />
                </div>
              </div>

              <div class="toolkit__slot">
                <div class="toolkit-card toolkit-card--lightroom">
                  <img src="/images/toolkit/art-direction/lightroom.svg" alt="Lightroom" />
                </div>
              </div>

              <div class="toolkit__slot">
                <div class="toolkit-card toolkit-card--transition">
                  <img src="/images/toolkit/art-direction/transition.png" alt="transition" />
                  <canvas
                    class="toolkit-card__cream-reveal toolkit-card__reveal-canvas"
                    aria-hidden="true"
                  ></canvas>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
